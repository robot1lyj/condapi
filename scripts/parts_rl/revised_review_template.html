<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>14 集抓取 · 修订审核</title>
<style>
:root{color-scheme:light;--ink:#193137;--muted:#617478;--green:#166d50;--red:#a63930}*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{padding:24px 30px;background:#163e43;color:white}h1{margin:0;font-size:26px}header p{margin:5px 0;color:#c7ddde}#stats{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap}#stats span{padding:7px 12px;border:1px solid #54777b;border-radius:8px}b{font-size:20px;margin-right:5px}.notice{padding:12px 30px;background:#fff0d1;color:#715013;font-size:14px}.tools{padding:12px 22px;background:white;display:flex;gap:9px;flex-wrap:wrap;border-bottom:1px solid #d5e0de}button,select,input,textarea{font:inherit}button,select,input{padding:8px 11px;border:1px solid #b9c9c6;border-radius:7px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{border-color:#166d50;background:#edf8f2}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #87c9b8;outline-offset:2px}.primary{background:#166d50;color:white}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);max-width:1500px;margin:auto}aside{padding:16px 12px;background:#eaf0ee}#list{max-height:calc(100vh - 320px);overflow:auto}.item{display:block;width:100%;text-align:left;margin:5px 0;border-color:transparent}.item.current{border:1px solid #28735d;box-shadow:inset 3px 0 #28735d}.item strong{display:block}.item small,.fine{color:var(--muted);font-size:13px}main{padding:22px;min-width:0}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h2{margin:0;font-size:24px}.spacer{flex:1}.badge{border-radius:20px;padding:4px 11px;background:#e3e9e7}.success{background:#dceee1;color:var(--green)}.failure{background:#f9e1dc;color:var(--red)}.non_grasp{background:#e0e9f2;color:#496070}.panel{margin:14px 0;padding:16px;background:white;border:1px solid #d4dfdc;border-radius:10px}.panel h3{font-size:16px;margin:0 0 9px}video{width:100%;background:#111b20;border-radius:9px;display:block}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.gallery img{width:100%;display:block;border-radius:5px}.gallery figure{margin:0}.gallery figcaption{font-size:12px;color:var(--muted)}#montage{display:block;width:100%;height:auto}.choices{display:flex;gap:9px;flex-wrap:wrap}.selected{outline:2px solid #166d50;outline-offset:2px}textarea{width:100%;padding:9px;border:1px solid #c8d5d0;border-radius:6px;margin-top:12px;min-height:65px}.hidden{display:none}#count{font-size:13px;margin:0 5px 10px}footer{padding:16px 30px;font-size:12px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:170px minmax(0,1fr)}main{padding:13px}.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.layout{display:block}#list{max-height:160px}.gallery{grid-template-columns:1fr}}
</style>
<header><h1>14 集抓取 · 修订审核</h1><p>物理尝试重切段 · 连续图像核验 · DINOv3 参考对照 · 无自动跟踪</p><div id="stats"></div></header>
<div class="notice">本页给出“抓到／没抓到”的候选结果。置信度不是实测准确率；正常放置松爪不算抓取失败。您抽检后可修改、导出，尚未将候选奖励批准用于 RL。第一集已用于感知调试，不作为独立感知测试。</div>
<div class="tools"><select id="episode" aria-label="集数"><option value="">全部集数</option></select><select id="arm" aria-label="机械臂"><option value="">双臂</option><option value="left">左臂</option><option value="right">右臂</option></select><select id="label" aria-label="分类"><option value="">全部分类</option><option value="success">抓到</option><option value="failure">没抓到</option><option value="non_grasp">非独立抓取</option></select><select id="priority" aria-label="抽检优先级"><option value="">全部置信度</option><option value="flag">优先抽检</option><option value="low">中低置信度</option><option value="reviewed">已人工审核</option></select><input id="search" placeholder="查找 E04-R" aria-label="候选编号" size="14"><span class="spacer"></span><button id="import">导入审核</button><input id="file" class="hidden" type="file" accept=".json"><button id="export" class="primary">导出审核 JSON</button><button id="csv">导出审核 CSV</button></div>
<div class="layout"><aside><div id="count"></div><nav id="list" aria-label="候选列表"></nav></aside><main><div id="empty" class="hidden">当前筛选为空。</div><div id="detail"><div class="top"><h2 id="title"></h2><span id="badge" class="badge"></span><span class="spacer"></span><button id="prev">← 上一个</button><button id="next">下一个 →</button></div><p id="source" class="fine"></p><video id="video" controls preload="metadata" playsinline></video><div class="panel"><h3>判定依据</h3><p id="reason"></p><p id="quality" class="fine"></p><details><summary>查看模型原始判断</summary><pre id="raw" style="white-space:pre-wrap;font-size:12px"></pre></details></div><div class="panel"><h3>您的抽检</h3><div id="choices" class="choices"><button data-label="success">抓到</button><button data-label="failure">没抓到</button><button data-label="non_grasp">非独立抓取</button><button data-label="">清除本条审核</button></div><textarea id="notes" placeholder="可选备注，例如：这里是提前掉落" aria-label="审核备注"></textarea><p id="status" class="fine"></p></div><div class="panel"><h3>逐帧腕部原图 · 点击打开大图</h3><div id="gallery" class="gallery"></div></div><details class="panel"><summary>查看腕部、指间放大和顶视完整时间序列</summary><img id="montage" alt="完整抓取时间序列"></details></div></main></div><footer id="identity"></footer>
<script>
const DATA=__DATA__;
const $=id=>document.getElementById(id), names={success:'抓到',failure:'没抓到',non_grasp:'非独立抓取'},key='grasp-review-'+DATA.identity;
let reviews={},visible=[],current=null,displayed=null;
function validate(rows){const ids=new Set(DATA.cards.map(c=>c.candidate_id)),seen=new Set(),out={};if(!Array.isArray(rows))throw Error('审核数据必须为列表');for(const r of rows){if(!ids.has(r.candidate_id)||seen.has(r.candidate_id)||![null,'success','failure','non_grasp'].includes(r.review_label)||typeof r.notes!=='string')throw Error('审核条目无效');seen.add(r.candidate_id);out[r.candidate_id]={review_label:r.review_label,notes:r.notes,reviewed_at:r.reviewed_at||null};}return out;}
try{const saved=localStorage.getItem(key);if(saved)reviews=validate(JSON.parse(saved));}catch(e){console.warn('无法恢复本地审核',e);}
function records(){return DATA.cards.map(c=>({candidate_id:c.candidate_id,proposed_label:c.suggested_label,proposed_reward:c.proposed_reward,...(reviews[c.candidate_id]||{review_label:null,notes:'',reviewed_at:null})}));}
function save(){try{localStorage.setItem(key,JSON.stringify(records()));$('status').textContent='已暂存在本浏览器，请在完成后导出。';}catch(e){$('status').textContent='浏览器暂存不可用，请导出审核。';}}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function counters(){$('stats').replaceChildren();const c=DATA.summary.suggested_counts,done=Object.values(reviews).filter(r=>r.review_label).length;for(const [v,t] of [[14,'集'],[DATA.cards.length,'个提案'],[c.success||0,'抓到'],[c.failure||0,'没抓到'],[c.non_grasp||0,'非独立抓取'],[done,'已审核']]){const s=el('span');s.append(el('b','',String(v)),document.createTextNode(t));$('stats').append(s);}}
function filter(){visible=DATA.cards.filter(c=>(!$('episode').value||c.episode_number===Number($('episode').value))&&(!$('arm').value||c.arm===$('arm').value)&&(!$('label').value||c.suggested_label===$('label').value)&&c.candidate_id.toLowerCase().includes($('search').value.trim().toLowerCase())&&(!$('priority').value||($('priority').value==='flag'&&c.audit_flags.length>0)||($('priority').value==='low'&&c.confidence!=='high')||($('priority').value==='reviewed'&&reviews[c.candidate_id]?.review_label)));if(!visible.some(c=>c.candidate_id===current))current=visible[0]?.candidate_id||null;list();detail();counters();}
function list(){$('count').textContent=`显示 ${visible.length} / ${DATA.cards.length}`;$('list').replaceChildren();for(const c of visible){const b=el('button','item'+(c.candidate_id===current?' current':''));b.append(el('strong','',c.candidate_id),el('small','',`${c.arm==='left'?'左臂':'右臂'} · ${names[c.suggested_label]}${reviews[c.candidate_id]?.review_label?' · 已审':''}`));b.onclick=()=>{current=c.candidate_id;list();detail();};$('list').append(b);}}
function detail(){const c=visible.find(c=>c.candidate_id===current);$('empty').classList.toggle('hidden',Boolean(c));$('detail').classList.toggle('hidden',!c);if(!c){$('video').pause();displayed=null;return;}$('title').textContent=c.candidate_id;$('badge').className='badge '+c.suggested_label;$('badge').textContent=names[c.suggested_label];$('source').textContent=`${c.arm==='left'?'左臂':'右臂'} · 闭爪行 ${c.close_row} → 判定末行 ${c.inspection_end_row} → 片段末行 ${c.end_row} · 视频：顶视 / 左腕 / 右腕`;if(displayed!==current){$('video').src=c.clip.path;$('video').load();displayed=current;}$('reason').textContent=c.reasons.join(' ');$('quality').textContent=`置信度 ${({high:'高',medium:'中',low:'低'})[c.confidence]} · ${c.label_source==='assistant_visual_audit'?'助手目视复核':'自动候选'} · 候选奖励 ${c.proposed_reward===null?'不适用':c.proposed_reward} · DINO支持 ${c.dino.outcome?names[c.dino.outcome]:'证据有混合'} · ${c.audit_flags.length?'有抽检提示':'无模型冲突提示'}`;$('raw').textContent=JSON.stringify({vlm:c.vlm.decision,dino:c.dino,visual_audit:c.visual_audit},null,2);$('gallery').replaceChildren();for(const f of c.frames){const fig=el('figure'),a=el('a'),im=el('img');a.href=f.views[c.arm].image;a.target='_blank';a.rel='noopener';im.loading='lazy';im.src=f.views[c.arm].image;im.alt=`${c.candidate_id} 行 ${f.row}`;a.append(im);fig.append(a,el('figcaption','',`行 ${f.row} · ${f.since_close_s.toFixed(2)}s · 开度 ${f.openness.toFixed(2)} · ΔZ ${(f.lift_from_closure_m*100).toFixed(1)}cm`));$('gallery').append(fig);}$('montage').src=c.montage;$('notes').value=reviews[current]?.notes||'';document.querySelectorAll('#choices button').forEach(b=>b.classList.toggle('selected',Boolean(reviews[current]?.review_label)&&b.dataset.label===reviews[current].review_label));$('status').textContent=reviews[current]?.review_label?'本条已审核：'+names[reviews[current].review_label]:'本条尚未由您审核。';$('prev').disabled=visible[0]?.candidate_id===current;$('next').disabled=visible.at(-1)?.candidate_id===current;}
function step(n){const i=visible.findIndex(c=>c.candidate_id===current),c=visible[i+n];if(c){current=c.candidate_id;list();detail();}}
for(const n of [...new Set(DATA.cards.map(c=>c.episode_number))].sort((a,b)=>a-b)){const o=el('option','',`第 ${n} 集`);o.value=n;$('episode').append(o);}for(const id of ['episode','arm','label','priority'])$(id).onchange=filter;$('search').oninput=filter;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
document.querySelectorAll('#choices button').forEach(b=>b.onclick=()=>{if(!current)return;reviews[current]={review_label:b.dataset.label||null,notes:$('notes').value,reviewed_at:b.dataset.label?new Date().toISOString():null};save();filter();});$('notes').oninput=()=>{if(!current)return;reviews[current]={...(reviews[current]||{review_label:null,reviewed_at:null}),notes:$('notes').value};save();};
function download(text,type,ext){const url=URL.createObjectURL(new Blob([text],{type})),a=el('a');a.href=url;a.download=DATA.summary.dataset_id+'-human-review.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('export').onclick=()=>download(JSON.stringify({schema:'revised_grasp_human_review_v3',dataset_id:DATA.summary.dataset_id,identity:DATA.identity,ready_for_training:false,records:records()},null,2)+'\n','application/json;charset=utf-8','json');$('csv').onclick=()=>{const quote=x=>'"'+String(x??'').replaceAll('"','""')+'"',fields=['candidate_id','proposed_label','proposed_reward','review_label','notes','reviewed_at'];download('\uFEFF'+fields.join(',')+'\n'+records().map(r=>fields.map(f=>quote(r[f])).join(',')).join('\n'),'text/csv;charset=utf-8','csv');};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;const d=JSON.parse(await f.text());if(d.schema!=='revised_grasp_human_review_v3'||d.dataset_id!==DATA.summary.dataset_id||d.identity!==DATA.identity)throw Error('数据集或分类版本不匹配');reviews=validate(d.records);save();filter();}catch(e){alert('导入失败：'+e.message);}finally{$('file').value='';}};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});$('identity').textContent=`${DATA.summary.dataset_id} · 候选内容 SHA ${DATA.identity.slice(0,16)} · 原始数据与旧审核包保留 · 无 RL 训练`;filter();
</script></html>
