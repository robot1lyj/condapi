services:
  pi:
    image: ${THOR_PI_IMAGE:-openpi-pi:thor-jax-20260907}
    build:
      context: ../../..
      dockerfile: scripts/docker/thor/Dockerfile
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    shm_size: 8gb
    volumes:
      - ${THOR_PI_ROOT:-/home/wuyan-lyj/thor/pi}/checkpoints:/checkpoints:ro
      - ${THOR_PI_ROOT:-/home/wuyan-lyj/thor/pi}/cache:/cache
      - ${THOR_PI_ROOT:-/home/wuyan-lyj/thor/pi}/results:/results
      - ${THOR_PI_ROOT:-/home/wuyan-lyj/thor/pi}/test-data:/test-data:ro
    # Default is a one-shot GPU health check, not an automatically running policy.
    # Recorded model inference uses run_suite_host.py for temporary MAXN and cleanup.
    restart: "no"
