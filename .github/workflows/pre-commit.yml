name: pre-commit
# Run manually only; routine pushes and PRs must not trigger notification emails.
on:
  workflow_dispatch:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v3
      - uses: pre-commit/action@v3.0.1
