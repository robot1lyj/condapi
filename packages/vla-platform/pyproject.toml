[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-vla-platform"
version = "0.1.0"
description = "Dependency-isolated VLA experiment and inference control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vla = "vla_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
