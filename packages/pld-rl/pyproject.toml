[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-pld-rl"
version = "0.1.0"
description = "Frozen-VLA residual learning: audited behavior-value initialization"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "torch>=2.10,<2.11", "torchvision>=0.25,<0.26", "pillow>=12,<13", "av>=15,<17", "h5py>=3.14,<4"]

[tool.setuptools.packages.find]
where = ["src"]
