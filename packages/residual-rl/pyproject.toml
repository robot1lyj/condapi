[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-residual-rl"
version = "0.1.0"
description = "Independent physical-action Cal-QL critic initialization and residual SAC core"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]
