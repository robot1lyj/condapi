[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-parts-rl"
version = "0.1.0"
description = "Paper-based PARTS LEGO grasp residuals, supervision and TD3+BC"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
learner = ["torch>=2.5,<3"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
