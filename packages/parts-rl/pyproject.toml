[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-parts-rl"
version = "0.1.0"
description = "Isolated residual RL learner for audited YAM subtask replay"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<2.3", "torch==2.7.1", "h5py>=3.12,<4"]

[tool.setuptools.packages.find]
where = ["src"]
