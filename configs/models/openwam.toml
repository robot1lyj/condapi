schema_version = 1
id = "openwam"
backend = "openwam"
status = "implemented"
operations = ["train", "infer"]
contracts = ["yam-bimanual-v1"]
note = "YAM LeRobot v2/v3 adapter and native finetune/resume/offline inference interfaces implemented; no GPU training or Thor deployment acceptance yet."

[io.train]
contract_id = "yam-bimanual-v1"
state_space = "yam_joint_absolute_14"
action_space = "yam_joint_absolute_14"
cameras = ["observation.images.top_rgb", "observation.images.left_rgb", "observation.images.right_rgb"]
methods = ["full"]

[io.infer]
contract_id = "yam-bimanual-v1"
state_space = "yam_joint_absolute_14"
action_space = "yam_joint_absolute_14"
cameras = ["observation.images.top_rgb", "observation.images.left_rgb", "observation.images.right_rgb"]
methods = ["native"]
