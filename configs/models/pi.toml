schema_version = 1
id = "pi"
backend = "openpi"
status = "implemented"
contracts = ["yam-bimanual-v1"]
operations = ["train", "infer", "benchmark", "export"]
note = "Existing OpenPI entrypoints wired; new Conda environments are not GPU-audited."

[io.train]
contract_id = "yam-bimanual-v1"
state_space = "yam_joint_absolute_14"
action_space = "yam_joint_absolute_14"
cameras = ["observation.images.top_rgb", "observation.images.left_rgb", "observation.images.right_rgb"]
methods = ["full", "lora"]

[io.infer]
contract_id = "yam-bimanual-v1"
state_space = "yam_joint_absolute_14"
action_space = "yam_joint_absolute_14"
cameras = ["observation.images.top_rgb", "observation.images.left_rgb", "observation.images.right_rgb"]
methods = ["native"]
